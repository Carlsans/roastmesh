name: Windows build

# Windows binaries cannot be produced on the Linux machine this project is
# developed on -- PyInstaller does not cross-compile -- so this is the only
# path to a Windows artifact. The Linux release deliberately stays a manual
# `packaging/build-docker.sh` run, because that pipeline is already verified
# against five distros and there is no reason to disturb it.
#
# On a tag push the installer is attached to that tag's GitHub release.
# workflow_dispatch builds and uploads an artifact without releasing, which is
# how to test a change to this file without cutting a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach assets to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,dev]"

      - name: Run the test suite on Windows
        # The highest-value step here. These fixes were written by auditing,
        # without a Windows machine to try them on, so this is the first thing
        # that actually executes them on the target platform -- the process
        # cancellation path, the UTF-8 file handling, the socket setup.
        run: pytest -q

      - name: Build the binaries
        run: pyinstaller packaging/roastmesh.spec --clean --noconfirm

      - name: Smoke-test the binaries
        # Prove the CLI runs (which exercises the bundled cryptography and iroh
        # native libraries) and that the GUI actually *starts*.
        #
        # "Still running after N seconds" is not sufficient on Windows, and
        # trusting it shipped a completely broken GUI to a user: PyInstaller
        # reports fatal startup errors in a dialog, which keeps the process
        # alive, so this check passed while roastmesh-gui.exe was dying on a
        # missing module. The honest signal is the single-instance listener --
        # the GUI binds it in main(), so it can only be there if startup
        # genuinely got that far.
        shell: pwsh
        run: |
          .\dist\roastmesh.exe --version
          .\dist\roastmesh.exe identity show
          $gui = Start-Process -FilePath .\dist\roastmesh-gui.exe -PassThru
          $listening = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($gui.HasExited) { throw "roastmesh-gui.exe exited early (code $($gui.ExitCode))" }
            $c = New-Object Net.Sockets.TcpClient
            try { $c.Connect("127.0.0.1", 41892); $listening = $true } catch { } finally { $c.Close() }
            if ($listening) { break }
          }
          if (-not $listening) {
            throw "roastmesh-gui.exe is running but never bound its single-instance port -- it did not actually start (a PyInstaller error dialog keeps the process alive)"
          }
          Write-Host "GUI started and bound its single-instance port -- OK"
          Stop-Process -Id $gui.Id -Force

      - name: Check the DHT is reachable from the packaged build
        # The feature this whole release exists to deliver. Windows has a UDP
        # quirk (see dht.py's udp_socket) that would make discovery fail
        # silently; this is what would catch a regression in that fix.
        shell: pwsh
        continue-on-error: true      # a runner's egress may block the DHT; informational
        run: .\dist\roastmesh.exe node doctor

      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }

          # Located rather than assumed: NSIS ships on the runner images, but
          # not always at the same path (a hardcoded Program Files (x86) path
          # failed outright on windows-latest), and the image contents drift.
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            foreach ($p in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe",
                             "$env:ProgramFiles\NSIS\makensis.exe",
                             "$env:ChocolateyInstall\bin\makensis.exe")) {
              if ($p -and (Test-Path $p)) { $nsis = $p; break }
            }
          }
          if (-not $nsis) {
            choco install nsis -y --no-progress | Out-Null
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          Write-Host "using $nsis"
          & $nsis "/DVERSION=$version" packaging\roastmesh.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }

      - name: Test the installer end to end
        # Catches the "works from dist\, broken once installed" class -- which
        # is exactly how the Linux side once shipped translations that worked
        # from source and silently fell back to English when packaged.
        shell: pwsh
        run: |
          .\dist\roastmesh-setup-x86_64.exe /S
          Start-Sleep -Seconds 10
          $dir = "$env:LOCALAPPDATA\Programs\roastmesh"
          foreach ($f in @("roastmesh.exe", "roastmesh-gui.exe", "uninstall.exe")) {
            if (-not (Test-Path "$dir\$f")) { throw "installer did not place $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\roastmesh.lnk")) {
            throw "Start Menu shortcut missing"
          }
          & "$dir\roastmesh.exe" --version
          & "$dir\uninstall.exe" /S
          Start-Sleep -Seconds 10
          if (Test-Path "$dir\roastmesh.exe") { throw "uninstaller left roastmesh.exe behind" }
          Write-Host "install -> run -> uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: roastmesh-windows
          path: |
            dist/roastmesh.exe
            dist/roastmesh-gui.exe
            dist/roastmesh-setup-x86_64.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The Linux assets are named bare `roastmesh` / `roastmesh-gui` and
        # install.sh fetches those exact names, so the .exe names coexist with
        # them. Renaming the Linux assets would break every copy of install.sh
        # already in circulation.
        run: gh release upload "${{ github.ref_name }}" dist/roastmesh.exe dist/roastmesh-gui.exe dist/roastmesh-setup-x86_64.exe --clobber
